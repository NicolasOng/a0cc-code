[pytest]
# The real test suite is tests/. Without testpaths, a bare `pytest` also walks
# scripts/ (several one-off analyses are named *_test.py but contain no tests)
# and .claude/worktrees/ (separate checkouts of this same repo), which produced
# ~25 collection errors and made the suite look broken.
testpaths = tests
norecursedirs = venv .env build dist recordings output default logs python2 .claude scripts sweep-output input
